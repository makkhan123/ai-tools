<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receipt Generator · Download</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #eef4fa;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            padding: 30px 20px;
            min-height: 100vh;
        }
        .wrapper {
            max-width: 1100px;
            width: 100%;
        }
        .card {
            background: white;
            border-radius: 40px;
            padding: 30px 32px 34px;
            box-shadow: 0 20px 40px -12px rgba(0,20,40,0.25);
            transition: 0.2s;
        }
        h1 {
            font-size: 2rem;
            font-weight: 650;
            letter-spacing: -0.3px;
            color: #0b263b;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 3px solid #e2ebf4;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        h1 small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #3a637b;
            margin-left: 6px;
        }
        .shop-area {
            background: #f6faff;
            border-radius: 28px;
            padding: 18px 22px 22px;
            margin-bottom: 28px;
            border: 1px solid #dce6f0;
        }
        .shop-label {
            display: block;
            font-weight: 500;
            color: #1f3d54;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }
        .shop-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 1.2rem;
            font-weight: 500;
            border: 2px solid #d0ddee;
            border-radius: 60px;
            background: white;
            outline: none;
            transition: 0.15s;
            color: #0b1e2f;
        }
        .shop-input:focus {
            border-color: #1f6d97;
            box-shadow: 0 0 0 4px rgba(31,109,151,0.12);
        }
        .receipt-preview {
            background: #fafdff;
            border-radius: 28px;
            padding: 16px 18px 20px;
            border: 1px solid #dfe9f2;
            margin-bottom: 22px;
        }
        .receipt-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0b2a41;
            text-align: center;
            letter-spacing: 0.3px;
            padding: 8px 0 12px;
            border-bottom: 2px dashed #c4d6e8;
            margin-bottom: 16px;
            word-break: break-word;
        }
        .receipt-title span {
            color: #1f6d97;
        }
        .table-wrap {
            overflow-x: auto;
            margin-bottom: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        th {
            background: #e7eff8;
            color: #1a3f57;
            font-weight: 600;
            padding: 12px 4px;
            text-align: center;
            border: 1px solid #ceddea;
        }
        td {
            padding: 6px 3px;
            text-align: center;
            border: 1px solid #d4e0ec;
            vertical-align: middle;
            background: white;
        }
        .item-input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 8px 2px;
            font-size: 0.9rem;
            text-align: center;
            outline: none;
            border-radius: 8px;
            transition: 0.1s;
            font-weight: 450;
        }
        .item-input:focus {
            background: #eef5fe;
            box-shadow: inset 0 0 0 2px #7aaacb;
        }
        .item-input.qty {
            width: 58px;
        }
        .item-input.tp,
        .item-input.discount,
        .item-input.net,
        .item-input.amount {
            width: 80px;
        }
        .item-input.product {
            min-width: 95px;
        }
        .remove-btn {
            background: none;
            border: none;
            color: #a52a3a;
            font-size: 1.3rem;
            cursor: pointer;
            font-weight: 700;
            padding: 0 4px;
            transition: 0.15s;
        }
        .remove-btn:hover {
            color: #c53d4f;
            transform: scale(1.25);
        }
        .grand-total-row {
            background: #e3eefa;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .grand-total-row td {
            padding: 14px 8px;
            border-top: 2px solid #b3cce2;
        }
        .grand-total-row td:last-child {
            color: #0b2a41;
            font-size: 1.35rem;
            background: #d4e5f5;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-top: 18px;
        }
        .btn {
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            background: #e7eef6;
            color: #1d4057;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
        }
        .btn-primary {
            background: #1a567a;
            color: white;
            box-shadow: 0 8px 14px -8px rgba(20,70,110,0.3);
        }
        .btn-primary:hover {
            background: #123f5b;
            transform: scale(0.97);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #b8d0e4;
        }
        .btn-outline:hover {
            background: #e3eefa;
            border-color: #7ea5c2;
        }
        .btn-success {
            background: #1a7a5c;
            color: white;
        }
        .btn-success:hover {
            background: #12644a;
        }
        .btn-generate {
            background: #2b4f6a;
            color: white;
            padding: 12px 36px;
            font-weight: 650;
        }
        .btn-generate:hover {
            background: #1a3a4f;
        }
        .btn-save {
            background: #1f6d97;
            color: white;
        }
        .btn-save:hover {
            background: #15547a;
        }
        .badge {
            background: #ccdcec;
            border-radius: 40px;
            padding: 4px 16px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1d4057;
        }
        .footer-hint {
            margin-top: 20px;
            color: #3f687f;
            font-size: 0.85rem;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #dde7f0;
            padding-top: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        /* generated receipt area */
        .generated-receipt-area {
            margin-top: 30px;
            background: #f3f8fe;
            border-radius: 32px;
            padding: 20px 22px 28px;
            border: 2px dashed #93b5d3;
            display: none;
        }
        .generated-receipt-area.show {
            display: block;
        }
        .gen-receipt-box {
            background: white;
            border-radius: 24px;
            padding: 28px 30px;
            box-shadow: 0 8px 20px rgba(0, 20, 40, 0.08);
            font-family: 'Courier New', monospace;
            max-width: 540px;
            margin: 0 auto;
        }
        .gen-title {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            border-bottom: 2px solid #222;
            padding-bottom: 10px;
            margin-bottom: 16px;
            font-family: system-ui, sans-serif;
        }
        .gen-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dotted #ccc;
            font-size: 0.95rem;
        }
        .gen-item span:first-child {
            font-weight: 500;
        }
        .gen-total {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.3rem;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 3px double #222;
        }
        .gen-footer {
            margin-top: 18px;
            text-align: center;
            font-size: 0.8rem;
            color: #4d6a7e;
        }
        .save-btns {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 16px;
        }
        @media (max-width: 650px) {
            .card {
                padding: 18px;
            }
            .item-input {
                font-size: 0.8rem;
            }
            .item-input.qty {
                width: 42px;
            }
            .item-input.tp,
            .item-input.discount,
            .item-input.net,
            .item-input.amount {
                width: 60px;
            }
            .item-input.product {
                min-width: 60px;
            }
            .actions {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <h1>🧾 Receipt · Percent <small>discount + generate</small></h1>

            <!-- shop name -->
            <div class="shop-area">
                <label class="shop-label">🏪 Shop name (receipt title)</label>
                <input type="text" class="shop-input" id="shopNameInput" placeholder="e.g. 'Green Valley Store'" value="Green Valley Store">
            </div>

            <!-- editable receipt table -->
            <div class="receipt-preview">
                <div class="receipt-title" id="receiptTitleDisplay">Green Valley Store</div>
                <div class="table-wrap">
                    <table id="itemTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Qty</th>
                                <th>Product</th>
                                <th>TP</th>
                                <th>Disc %</th>
                                <th>Net</th>
                                <th>Amount</th>
                                <th style="width:38px;">✕</th>
                            </tr>
                        </thead>
                        <tbody id="itemsBody"></tbody>
                        <tfoot>
                            <tr class="grand-total-row">
                                <td colspan="6" style="text-align:right; padding-right:16px;">GRAND TOTAL</td>
                                <td id="grandTotalDisplay">0.00</td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <!-- action buttons -->
            <div class="actions">
                <div>
                    <button class="btn btn-primary" id="addRowBtn">➕ Add item</button>
                    <button class="btn btn-outline" id="resetItemsBtn">⟳ Reset</button>
                    <button class="btn btn-outline" id="sampleDataBtn">📋 Sample</button>
                </div>
                <div>
                    <button class="btn btn-generate" id="generateBtn">🖨️ Generate Receipt</button>
                </div>
            </div>
            <div class="footer-hint">
                <span>💡 Discount is percentage (0–100). Net = TP - (TP * Disc%) . Amount = Qty × Net</span>
            </div>
        </div>

        <!-- GENERATED RECEIPT OUTPUT (hidden by default) -->
        <div class="generated-receipt-area" id="generatedReceiptArea">
            <div class="gen-receipt-box" id="generatedReceiptContent">
                <div class="gen-title" id="genShopTitle">Green Valley Store</div>
                <div id="genItemsList"></div>
                <div class="gen-total">
                    <span>GRAND TOTAL</span>
                    <span id="genGrandTotal">0.00</span>
                </div>
                <div class="gen-footer">📅 thank you · receipt generated</div>
            </div>
            <div class="save-btns">
                <button class="btn btn-save" id="saveImageBtn">💾 Download as PNG</button>
                <button class="btn btn-outline" id="closeGenBtn">✖ Close</button>
            </div>
        </div>
    </div>

    <!-- html2canvas library for image capture -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>

    <script>
        (function() {
            "use strict";

            // DOM refs
            const shopInput = document.getElementById('shopNameInput');
            const receiptTitle = document.getElementById('receiptTitleDisplay');
            const itemsBody = document.getElementById('itemsBody');
            const grandTotalSpan = document.getElementById('grandTotalDisplay');
            const addBtn = document.getElementById('addRowBtn');
            const resetBtn = document.getElementById('resetItemsBtn');
            const sampleBtn = document.getElementById('sampleDataBtn');
            const generateBtn = document.getElementById('generateBtn');
            const genArea = document.getElementById('generatedReceiptArea');
            const genShopTitle = document.getElementById('genShopTitle');
            const genItemsList = document.getElementById('genItemsList');
            const genGrandTotal = document.getElementById('genGrandTotal');
            const closeGenBtn = document.getElementById('closeGenBtn');
            const saveImageBtn = document.getElementById('saveImageBtn');

            // ---------- helpers ----------
            function formatCurrency(v) { return Number(v).toFixed(2); }

            // compute net from TP and discount% (0-100)
            function computeNet(tp, discPercent) {
                const tpNum = parseFloat(tp) || 0;
                const disc = Math.min(100, Math.max(0, parseFloat(discPercent) || 0));
                const net = tpNum * (1 - disc / 100);
                return Math.max(0, net);
            }

            // update row: net = tp - disc% , amount = qty * net
            function updateRow(row) {
                const qtyInp = row.querySelector('.item-qty');
                const tpInp = row.querySelector('.item-tp');
                const discInp = row.querySelector('.item-discount');
                const netInp = row.querySelector('.item-net');
                const amountInp = row.querySelector('.item-amount');

                if (!qtyInp || !tpInp || !discInp || !netInp || !amountInp) return;

                const qty = parseFloat(qtyInp.value) || 0;
                const tp = parseFloat(tpInp.value) || 0;
                const disc = parseFloat(discInp.value) || 0;
                const net = computeNet(tp, disc);
                netInp.value = formatCurrency(net);
                const amount = qty * net;
                amountInp.value = formatCurrency(amount);
                updateGrandTotal();
            }

            // grand total from all rows
            function updateGrandTotal() {
                const rows = itemsBody.querySelectorAll('tr.item-row');
                let total = 0;
                for (let row of rows) {
                    const amt = row.querySelector('.item-amount');
                    if (amt) total += parseFloat(amt.value) || 0;
                }
                grandTotalSpan.textContent = formatCurrency(total);
                return total;
            }

            // bind events to a row
            function bindRowEvents(row) {
                const inputs = row.querySelectorAll('.item-qty, .item-tp, .item-discount, .item-net, .item-amount');
                inputs.forEach(inp => {
                    inp.addEventListener('input', function(e) {
                        if (inp.classList.contains('item-qty') || inp.classList.contains('item-tp') || inp
                            .classList.contains('item-discount')) {
                            updateRow(row);
                        } else if (inp.classList.contains('item-net') || inp.classList.contains(
                            'item-amount')) {
                            const qty = parseFloat(row.querySelector('.item-qty')?.value) || 0;
                            const net = parseFloat(row.querySelector('.item-net')?.value) || 0;
                            const amount = qty * net;
                            const amountInp = row.querySelector('.item-amount');
                            if (amountInp && inp.classList.contains('item-net')) {
                                amountInp.value = formatCurrency(amount);
                            }
                            updateGrandTotal();
                        }
                    });
                    inp.addEventListener('blur', function() {
                        if (inp.type === 'number' || inp.classList.contains('item-tp') || inp.classList.contains(
                                'item-discount') ||
                            inp.classList.contains('item-net') || inp.classList.contains('item-amount')) {
                            const val = parseFloat(inp.value);
                            if (!isNaN(val) && inp !== row.querySelector('.item-qty')) {
                                inp.value = formatCurrency(val);
                            } else if (inp.classList.contains('item-qty')) {
                                const q = parseInt(inp.value) || 0;
                                inp.value = q;
                            }
                        }
                        updateRow(row);
                    });
                });

                // remove row
                const removeBtn = row.querySelector('.remove-btn');
                if (removeBtn) {
                    removeBtn.addEventListener('click', function() {
                        if (itemsBody.children.length > 1) {
                            row.remove();
                            renumberRows();
                            updateGrandTotal();
                        } else {
                            alert('Keep at least one item row.');
                        }
                    });
                }
                updateRow(row);
            }

            function renumberRows() {
                const rows = itemsBody.querySelectorAll('tr.item-row');
                rows.forEach((r, i) => {
                    const idx = r.querySelector('.row-index');
                    if (idx) idx.textContent = i + 1;
                });
            }

            // create a new row
            function createItemRow(qty = 1, product = '', tp = 0, discount = 0, net = 0, amount = 0) {
                const tr = document.createElement('tr');
                tr.className = 'item-row';

                const idxTd = document.createElement('td');
                idxTd.className = 'row-index';
                idxTd.textContent = itemsBody.children.length + 1;

                const qtyTd = document.createElement('td');
                const qtyInp = document.createElement('input');
                qtyInp.type = 'number';
                qtyInp.className = 'item-input qty item-qty';
                qtyInp.step = 'any';
                qtyInp.min = '0';
                qtyInp.value = qty;

                const prodTd = document.createElement('td');
                const prodInp = document.createElement('input');
                prodInp.type = 'text';
                prodInp.className = 'item-input product item-product';
                prodInp.placeholder = 'Item';
                prodInp.value = product;

                const tpTd = document.createElement('td');
                const tpInp = document.createElement('input');
                tpInp.type = 'number';
                tpInp.className = 'item-input tp item-tp';
                tpInp.step = 'any';
                tpInp.min = '0';
                tpInp.value = formatCurrency(tp);

                const discTd = document.createElement('td');
                const discInp = document.createElement('input');
                discInp.type = 'number';
                discInp.className = 'item-input discount item-discount';
                discInp.step = 'any';
                discInp.min = '0';
                discInp.max = '100';
                discInp.value = formatCurrency(discount);

                const netTd = document.createElement('td');
                const netInp = document.createElement('input');
                netInp.type = 'number';
                netInp.className = 'item-input net item-net';
                netInp.step = 'any';
                netInp.min = '0';
                netInp.value = formatCurrency(net);

                const amtTd = document.createElement('td');
                const amtInp = document.createElement('input');
                amtInp.type = 'number';
                amtInp.className = 'item-input amount item-amount';
                amtInp.step = 'any';
                amtInp.min = '0';
                amtInp.value = formatCurrency(amount);

                const remTd = document.createElement('td');
                const remBtn = document.createElement('button');
                remBtn.type = 'button';
                remBtn.className = 'remove-btn';
                remBtn.innerHTML = '✕';

                remTd.appendChild(remBtn);
                tr.appendChild(idxTd);
                tr.appendChild(qtyTd);
                tr.appendChild(prodTd);
                tr.appendChild(tpTd);
                tr.appendChild(discTd);
                tr.appendChild(netTd);
                tr.appendChild(amtTd);
                tr.appendChild(remTd);
                qtyTd.appendChild(qtyInp);
                prodTd.appendChild(prodInp);
                tpTd.appendChild(tpInp);
                discTd.appendChild(discInp);
                netTd.appendChild(netInp);
                amtTd.appendChild(amtInp);

                setTimeout(() => bindRowEvents(tr), 0);
                return tr;
            }

            function addRow(qty = 1, product = '', tp = 0, discount = 0, net = 0, amount = 0) {
                const row = createItemRow(qty, product, tp, discount, net, amount);
                itemsBody.appendChild(row);
                renumberRows();
                updateGrandTotal();
                const first = row.querySelector('.item-qty');
                if (first) first.focus();
            }

            function resetToEmpty() {
                itemsBody.innerHTML = '';
                addRow(1, '', 0, 0, 0, 0);
                updateTitle();
            }

            function updateTitle() {
                const val = shopInput.value.trim() || 'My Shop';
                receiptTitle.textContent = val;
            }

            function loadSample() {
                itemsBody.innerHTML = '';
                const samples = [
                    [3, 'Organic Apples', 4.20, 10, 3.78, 11.34],
                    [2, 'Sourdough Bread', 6.80, 15, 5.78, 11.56],
                    [1, 'Cheddar Cheese', 8.50, 0, 8.50, 8.50],
                    [4, 'Almond Milk', 3.90, 5, 3.705, 14.82],
                ];
                for (let [qty, product, tp, disc, net, amt] of samples) {
                    const row = createItemRow(qty, product, tp, disc, net, amt);
                    itemsBody.appendChild(row);
                }
                renumberRows();
                itemsBody.querySelectorAll('tr.item-row').forEach(r => bindRowEvents(r));
                updateGrandTotal();
                shopInput.value = 'Green Valley Store';
                updateTitle();
            }

            // ---------- GENERATE RECEIPT ----------
            function generateReceipt() {
                const shop = shopInput.value.trim() || 'My Shop';
                const rows = itemsBody.querySelectorAll('tr.item-row');
                const items = [];
                let grand = 0;
                for (let row of rows) {
                    const qty = parseFloat(row.querySelector('.item-qty')?.value) || 0;
                    const product = row.querySelector('.item-product')?.value || 'Item';
                    const tp = parseFloat(row.querySelector('.item-tp')?.value) || 0;
                    const disc = parseFloat(row.querySelector('.item-discount')?.value) || 0;
                    const net = parseFloat(row.querySelector('.item-net')?.value) || 0;
                    const amount = parseFloat(row.querySelector('.item-amount')?.value) || 0;
                    items.push({ qty, product, tp, disc, net, amount });
                    grand += amount;
                }
                genShopTitle.textContent = shop;
                let listHtml = '';
                items.forEach(it => {
                    listHtml += `
                        <div class="gen-item">
                            <span>${it.qty} × ${it.product}</span>
                            <span>${formatCurrency(it.amount)}</span>
                        </div>
                        <div style="font-size:0.75rem; color:#4a6a7a; padding-left:8px; margin-bottom:4px;">
                            TP: ${formatCurrency(it.tp)}  |  Disc: ${it.disc}%  |  Net: ${formatCurrency(it.net)}
                        </div>
                    `;
                });
                genItemsList.innerHTML = listHtml;
                genGrandTotal.textContent = formatCurrency(grand);
                genArea.classList.add('show');
            }

            // ---------- SAVE AS IMAGE (download PNG) ----------
            function saveAsImage() {
                const box = document.getElementById('generatedReceiptContent');

                // Use html2canvas to capture the receipt box
                html2canvas(box, {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    logging: false,
                    allowTaint: false,
                    useCORS: true
                }).then(canvas => {
                    // Create download link
                    const link = document.createElement('a');
                    link.download = 'receipt.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(err => {
                    alert('Could not generate image. Please try again or use screenshot.\n\nError: ' + err.message);
                    console.error('html2canvas error:', err);
                });
            }

            // ---------- event listeners ----------
            shopInput.addEventListener('input', updateTitle);
            addBtn.addEventListener('click', () => addRow(1, '', 0, 0, 0, 0));
            resetBtn.addEventListener('click', resetToEmpty);
            sampleBtn.addEventListener('click', loadSample);
            generateBtn.addEventListener('click', generateReceipt);
            closeGenBtn.addEventListener('click', function() {
                genArea.classList.remove('show');
            });
            saveImageBtn.addEventListener('click', saveAsImage);

            // init
            resetToEmpty();
            loadSample();

            console.log('🧾 Receipt generator ready — Download PNG works!');
        })();
    </script>
</body>
</html>
